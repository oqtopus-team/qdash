name: ${ENV:-default}
services:
  mongo:
    image: mongo
    restart: always
    env_file:
      - .env
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INIT_DATABASE: qubex
    volumes:
      - ${MONGO_DATA_PATH:-./mongo_data/data/db}:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''db.adminCommand({ ping: 1 })''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - custom_net
  calibration-migration:
    build:
      context: .
      dockerfile: ./src/qdash/api/Dockerfile
    restart: "no"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./src/qdash/dbmodel:/app/qdash/dbmodel
      - ${CALIB_DATA_PATH:-./calib_data}:/app/calib_data
    command: python -m qdash.dbmodel.migration run --execute
    environment:
      - PYTHONPATH=/app
      - CALIB_DATA_PATH=/app/calib_data
    networks:
      - custom_net
  mongo-express:
    image: mongo-express
    restart: always
    env_file:
      - .env
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    networks:
      - custom_net
  postgres:
    image: postgres:14
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - custom_net
  prefect-server:
    # Keep aligned with the Prefect version in uv.lock for worker API compatibility.
    image: prefecthq/prefect:3.8.5-python3.11
    restart: always
    env_file:
      - .env
    entrypoint: ["/bin/bash", "-c"]
    command: ["prefect server start --host 0.0.0.0"]
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - custom_net
  deployment-service:
    build:
      context: .
      dockerfile: ./src/qdash/workflow/Dockerfile.deployment
    restart: always
    env_file:
      - .env
    depends_on:
      prefect-server:
        condition: service_started
      calibration-migration:
        condition: service_completed_successfully
    volumes:
      - ./src/qdash/workflow:/app/qdash/workflow
      - ./src/qdash/analysis:/app/qdash/analysis # Shared spectroscopy analysis (also used by api)
      - ./src/qdash/copilot:/app/qdash/copilot
      - ./src/qdash/dbmodel:/app/qdash/dbmodel
      - ./src/qdash/datamodel:/app/qdash/datamodel
      - ./src/qdash/common:/app/qdash/common
      - ./src/qdash/repository:/app/qdash/repository
      - ./src/qdash/config.py:/app/qdash/config.py
      - ./config:/app/config
      - deployment-logs:/app/logs
    working_dir: /app/qdash/workflow
    command: uvicorn deployment_service:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${DEPLOYMENT_SERVICE_PORT:-8001}:8001"
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PYTHONPATH=/app:/app/qdash/workflow:/app/qdash/dbmodel:/app/qdash
      - DEFAULT_BACKEND=${DEFAULT_BACKEND:-qubex}
    networks:
      - custom_net
  user-flow-worker:
    build:
      context: .
      dockerfile: ./src/qdash/workflow/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      prefect-server:
        condition: service_started
      deployment-service:
        condition: service_started
      calibration-migration:
        condition: service_completed_successfully
    volumes:
      - ./src/qdash/workflow:/app/qdash/workflow
      - ./src/qdash/analysis:/app/qdash/analysis # Shared spectroscopy analysis
      - ./src/qdash/copilot:/app/qdash/copilot
      - ./src/qdash/dbmodel:/app/qdash/dbmodel
      - ./src/qdash/datamodel:/app/qdash/datamodel
      - ./src/qdash/common:/app/qdash/common
      - ./src/qdash/repository:/app/qdash/repository
      - ./src/qdash/config.py:/app/qdash/config.py
      - ${CALIB_DATA_PATH:-./calib_data}:/app/calib_data
      - ${CONFIG_PATH:-./config/qubex-config}:/app/config/qubex-config # Qubex backend configuration repository/data
      - ./config:/app/config # QDash app/domain/copilot config files
      - ${QUELWARE_CLIENT_PATH:-${HOME}/.config/quelware-client}:/root/.config/quelware-client # Qubex backend CLI for workflow tasks
      - worker-logs:/app/logs
    working_dir: /app/qdash/workflow
    command: python start_worker.py
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_LOGGING_SETTINGS_PATH=/app/config/app/logging/prefect.yaml
      - PYTHONPATH=/app:/app/qdash:/app/qdash/workflow:/app/qdash/dbmodel
      - DEFAULT_BACKEND=${DEFAULT_BACKEND:-qubex}
    networks:
      - custom_net
  api:
    build:
      context: .
      dockerfile: ./src/qdash/api/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "${API_PORT:-5715}:${API_PORT:-5715}"
    volumes:
      - ./src/qdash/api:/app/qdash/api
      - ./src/qdash/analysis:/app/qdash/analysis # Shared spectroscopy analysis (used by reanalysis service)
      - ./src/qdash/agent:/app/qdash/agent
      - ./src/qdash/copilot:/app/qdash/copilot
      - ./src/qdash/dbmodel:/app/qdash/dbmodel
      - ./src/qdash/datamodel:/app/qdash/datamodel
      - ./src/qdash/common:/app/qdash/common
      - ./src/qdash/repository:/app/qdash/repository
      - ./src/qdash/config.py:/app/qdash/config.py
      - ./src/qdash/workflow/user_flows:/app/qdash/workflow/user_flows # Shared user flows
      - ./src/qdash/workflow/templates:/app/qdash/workflow/templates # Flow templates
      - ./src/qdash/workflow/service:/app/qdash/workflow/service # Calibration service modules
      - ${CALIBTASKS_PATH:-./src/qdash/workflow/calibtasks}:/app/qdash/workflow/calibtasks # Calibration tasks
      - ./config:/app/config # QDash app/domain/copilot config files
      - ${CALIB_DATA_PATH:-./calib_data}:/app/calib_data
      - ${CONFIG_PATH:-./config/qubex-config}:/app/config/qubex-config # Qubex backend configuration repository/data
      - api-logs:/app/logs
      - agent-runtime-auth:/run/agent-runtime-auth:ro
    working_dir: /app/qdash/api
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --reload --bind :${API_PORT:-5715} --log-level debug
    develop:
      watch:
        - action: sync
          path: ./src/qdash/api
          target: /app/api
    depends_on:
      mongo:
        condition: service_healthy
      prefect-server:
        condition: service_started
      deployment-service:
        condition: service_started
      calibration-migration:
        condition: service_completed_successfully
      agent-runtime-auth:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/app:/app/qdash:/app/qdash/api:/app/qdash/dbmodel:/app/qdash/datamodel:/app/qdash
      - CALIB_DATA_PATH=/app/calib_data
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DEPLOYMENT_SERVICE_URL=http://deployment-service:8001
      - DEFAULT_BACKEND=${DEFAULT_BACKEND:-qubex}
      - PI_AGENT_RUNTIME_URL=http://agent-runtime:${AGENT_RUNTIME_PORT:-8002}
      - AGENT_RUNTIME_TOKEN=${AGENT_RUNTIME_TOKEN:-}
      - AGENT_RUNTIME_TOKEN_FILE=/run/agent-runtime-auth/token
    networks:
      - custom_net
  agent-runtime-auth:
    # Generate once per deployment; only API and runtime can read the secret.
    build:
      context: .
      dockerfile: ./src/qdash/api/Dockerfile
    restart: "no"
    network_mode: none
    volumes:
      - agent-runtime-auth:/run/agent-runtime-auth
    command:
      - python
      - -c
      - |
        import os, pathlib, secrets
        path = pathlib.Path('/run/agent-runtime-auth/token')
        if not path.exists():
            os.umask(0o077)
            temporary = path.with_suffix('.tmp')
            temporary.write_text(secrets.token_hex(32))
            temporary.chmod(0o400)
            os.chown(temporary, 1000, 1000)
            temporary.replace(path)
        if not path.read_text().strip():
            raise RuntimeError('Runtime credential file is empty')
  agent-runtime:
    # Pi Agent Runtime backing Copilot chat and figure analysis.
    build:
      context: .
      dockerfile: ./agent-runtime/Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - ./agent-runtime/src:/app/agent-runtime/src
      - ./agent-runtime/exec:/app/agent-runtime/exec # Hello protocol shared with agent-exec
      - ./config:/app/config # Read for copilot language and model settings only
      # Local pi extension checkouts for development (gitignored, empty in
      # production); the runtime trusts whatever package directories it finds.
      - ./agent-runtime/extensions:/app/extensions:ro
      - agent-runtime-state:/app/state
      - agent-runtime-auth:/run/agent-runtime-auth:ro
      - agent-exec-socket:/run/agent-exec:ro
    # Per-turn pi-qdash credential profiles are transient, including on crashes.
    tmpfs:
      - /tmp
    environment:
      - PORT=${AGENT_RUNTIME_PORT:-8002}
      - AGENT_RUNTIME_TOKEN=${AGENT_RUNTIME_TOKEN:-}
      - AGENT_RUNTIME_TOKEN_FILE=/run/agent-runtime-auth/token
      - PI_CODING_AGENT_DIR=/app/.pi-agent
      - AGENT_STATE_DIR=/app/state
      # A turn runs until it answers or the user stops it; calibrations a tool
      # waits on take as long as they take. Set these (ms) to steer the model to
      # answer after a while, or to abort a turn outright. 0 disables.
      - CHAT_WRAP_UP_MS=${AGENT_RUNTIME_WRAP_UP_MS:-0}
      - CHAT_TIMEOUT_MS=${AGENT_RUNTIME_TIMEOUT_MS:-0}
      - CHAT_PING_MS=${AGENT_RUNTIME_PING_MS:-15000}
      - MODEL_STREAM_TIMEOUT_MS=${AGENT_RUNTIME_MODEL_STREAM_TIMEOUT_MS:-180000}
      # The API forwards the logged-in user's token and project on each turn.
      # No shared API token or administrator login is used by the runtime.
      - QDASH_BASE_URL=http://api:${API_PORT:-5715}
      # Links in Copilot answers point here. QDASH_BASE_URL is an internal
      # hostname, so the browser-facing UI address comes from CLIENT_URL.
      - QDASH_WEB_URL=${CLIENT_URL:-http://localhost:${UI_PORT:-5714}}
      # Pi hides models whose provider has no credential, even when the server
      # ignores it. Keep a placeholder for keyless local endpoints.
      - OPENAI_COMPATIBLE_API_KEY_CHAT=${OPENAI_COMPATIBLE_API_KEY_CHAT:-openai-compatible}
      - OPENAI_COMPATIBLE_API_KEY_EVALUATION=${OPENAI_COMPATIBLE_API_KEY_EVALUATION:-openai-compatible}
      # The Copilot workspace (agent-exec below): where the chat's bash, read,
      # write and edit tools run. Unset AGENT_EXEC_SOCKET to offer no workspace.
      - AGENT_EXEC_SOCKET=/run/agent-exec/exec.sock
      # Bun's fetch reads HTTP(S)_PROXY on its own. NO_PROXY comes from .env via
      # env_file; redeclaring it here would let an ambient shell value win.
    depends_on:
      api:
        condition: service_started
      agent-exec:
        condition: service_started
      agent-runtime-auth:
        condition: service_completed_successfully
    networks:
      - custom_net
  agent-exec:
    # The Copilot workspace: a shell and files for each chat, behind the
    # runtime's bash/read/write/edit tools. It holds no QDash credentials (no
    # env_file) and has no network. A Unix socket restricted to the runtime's
    # group (bun, gid 1000) prevents workspace users from impersonating others.
    # The server starts one pi-env daemon per conversation as that user's own
    # uid; see docs/developer-guide/copilot/workspace.md.
    build:
      context: .
      dockerfile: ./agent-runtime/exec/Dockerfile
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agent-exec-workspace:/workspace
      - agent-exec-socket:/run/agent-exec
    environment:
      - AGENT_EXEC_SOCKET=/run/agent-exec/exec.sock
      - AGENT_EXEC_SOCKET_GID=1000
    # Root only to chown each owner's directory and drop to that uid (setpriv).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 512
          memory: ${AGENT_EXEC_MEMORY_LIMIT:-2g}
    network_mode: none
  ui:
    build:
      context: .
      dockerfile: ./ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ENV: ${ENV}
        NEXT_PUBLIC_DEFAULT_THEME: ${NEXT_PUBLIC_DEFAULT_THEME:-light}
        NEXT_PUBLIC_PREFECT_URL: ${NEXT_PUBLIC_PREFECT_URL}
        INTERNAL_API_URL: http://api:${API_PORT:-5715}
    restart: always
    env_file:
      - .env
    environment:
      - PORT=${UI_PORT:-5714}
    ports:
      - "${UI_PORT:-5714}:${UI_PORT:-5714}"
    depends_on:
      - api
    networks:
      - custom_net
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    env_file:
      - .env
    command:
      - tunnel
      - --no-autoupdate
      - --no-chunked-encoding
      - run
    network_mode: host
    profiles:
      - tunnel
networks:
  custom_net:
    external: false
volumes:
  deployment-logs:
  worker-logs:
  api-logs:
  agent-runtime-state:
  agent-runtime-auth:
  agent-exec-workspace:
  agent-exec-socket:
