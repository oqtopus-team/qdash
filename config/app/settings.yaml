# QDash Settings
# This file contains default settings for the QDash application.
#
# Note: Container-side paths (like /app/calib_data) are defined as constants
# in source code. To customize host-side paths, use .env and docker-compose.yaml.

# =============================================================================
# Backend Configuration
# =============================================================================
# QDash supports two backend types:
#   - qubex: Production backend using real quantum hardware via qubex library
#   - fake: Testing backend with simulated measurements (no hardware required)
#
# The fake backend runs the qubex task implementations on a simulator, so task names are
# the same on both backends and a flow switches backend without changing its task list:
#   task_names = ["CheckChevron", "CheckRabi", "CheckT1"]
#   config = CalibConfig(backend_name="fake", ...)   # simulator
#   config = CalibConfig(backend_name="qubex", ...)  # hardware
#
# The one fake-only task, FakeBringUp, seeds a fresh project with the simulator's device
# parameters. The fake task set is the `fake` section of backend.yaml.

# =============================================================================
# UI Settings
# =============================================================================
ui:
  # Task Files Editor Settings
  task_files:
    # Default backend to select when opening the Task Files page
    # Available backends: qubex, fake
    default_backend: qubex

    # Default view mode for the sidebar
    # Options: tasks, files
    default_view_mode: tasks

    # Task list sort order
    # Options: category, type_then_name, name_only, file_path
    sort_order: category
