# Backend Configuration
# =====================
# This file defines available backends and their tasks.
#
# Tasks not listed here may appear in the task catalog, but cannot be run
# from the UI or workflows, even if the code exists in the codebase.
#
# Use this to:
#   - Control which tasks are exposed to users per backend
#   - Hide experimental or deprecated tasks

# =============================================================================
# Default Backend
# =============================================================================
default_backend: qubex

# =============================================================================
# Backend Definitions
# =============================================================================
backends:
  # ---------------------------------------------------------------------------
  # Qubex Backend (Production - Real Quantum Hardware)
  # ---------------------------------------------------------------------------
  qubex:
    description: "Production backend using qubex library with real quantum hardware"

    # Tasks available for this backend (shown in UI and available for workflows)
    tasks:
      One Qubit:
        - CheckAdaptiveChevron
        - CheckChevron
        - CheckOptimalReadoutAmplitude
        - CheckOptimalReadoutFrequency
        - RabiOscillation
        - CheckRabi
        - CheckCoarseReadoutParams
        - CheckCKP
        - CheckQuantumEfficiency
        - CheckCPMGNoiseSpectroscopy
        - CreateHPIPulse
        - CheckHPIPulse
        - CreatePIPulse
        - CheckPIPulse
        - CheckRamsey
        - CheckT1
        - CheckT2Echo
        - CreateDRAGHPIPulse
        - CheckDRAGHPIPulse
        - CreateDRAGPIPulse
        - CheckDRAGPIPulse
        - CheckAdaptiveEFChevron
        - CheckEFRabi
        - CreateEFHPIPulse
        - CreateEFPIPulse
        - CheckAdaptiveFHChevron
        - EFReadoutClassification
        - CheckThermalExcitation
        - CheckSpinLockSpectroscopy
        - CheckReadoutMIST
        - ReadoutClassification
        - RandomizedBenchmarking
        - X90InterleavedRandomizedBenchmarking
        - X180InterleavedRandomizedBenchmarking

      Two Qubit:
        - CheckCouplingStrength
        - CheckJAZZ
        - CheckCrossResonance
        - CreateZX90
        - CheckZX90
        - CheckBellState
        - CheckBellStateTomography
        - ZX90InterleavedRandomizedBenchmarking

      CW:
        - CheckResonatorSpectroscopy
        - CheckQubitSpectroscopy
        - CheckWaveform
        - CheckControlAmplitude

      Other:
        - Configure
        - ConfigureEF
        - ConfigureAll
        - LinkUp
        - CheckStatus
        - CheckNoise
        - DumpBox
        - ReadoutConfigure

  # ---------------------------------------------------------------------------
  # Fake Backend (Testing - No Hardware Required)
  # ---------------------------------------------------------------------------
  fake:
    description: "Testing backend that runs the qubex task implementations on a simulator"

    # FakeBringUp is the only task implemented by the fake package: it seeds a fresh project
    # with the simulator's device parameters. Every other task listed here is the qubex task
    # of the same name, routed to the fake backend (see calibtasks/fake/__init__.py).
    tasks:
      One Qubit:
        - FakeBringUp
        - CheckChevron
        - CheckRabi
        - CreateHPIPulse
        - CheckHPIPulse
        - CreatePIPulse
        - CheckPIPulse
        - CheckT1
        - CheckT2Echo
        - CheckRamsey
