# Agent Chat Models: oqtopus profile (sample)
#
# Used when QDASH_AGENT_PROFILE=oqtopus. Replaces config/agent/chat.yaml as a
# whole; it is not merged with it. Only `chat_models` may be set here; shared
# settings stay in config/agent/config.yaml. The first entry is the default.
# Every entry is checked when the profile loads; see
# docs/developer-guide/agent/model-configuration.md#deployment-profiles.
#
# This is a sample, not a verified deployment: no serving API has been tested
# with it. Before selecting it, the operator confirms against the deployment
# that serves the model that the model name, Chat Completions support, context
# length and output limit below hold, and adjusts them where they do not.
chat_models:
  # Operator prerequisite: an OpenAI-compatible Chat Completions API serving
  # this model name. OPENAI_COMPATIBLE_BASE_URL_CHAT must include /v1.
  - provider: openai-compatible-chat
    name: Qwen/Qwen3.8-27B
    api_style: completion
    base_url: env:OPENAI_COMPATIBLE_BASE_URL_CHAT
    api_key_env: OPENAI_COMPATIBLE_API_KEY_CHAT
    temperature: 0.7
    # Sample values: num_ctx must not exceed the deployment's maximum context
    # length (for vLLM, max_model_len), and max_output_tokens must be below it.
    num_ctx: 131072
    max_output_tokens: 8192
