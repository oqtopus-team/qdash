# Copilot Evaluation Configuration
# The calibration evaluation model and the chip health scoring thresholds.
#
# Evaluation is a recorded judgement of a task result's figure, made by the
# evaluation model through pi-qcaleval's `qcal_evaluate` (chip page bulk runs,
# single-result runs, the chat planner). Chat and planner models live in
# chat.yaml; the pi runtime builds its models.json from both files.

# Models that judge calibration plots. pi-qcaleval picks the first model whose
# id matches Ising-Calibration; without one it falls back to the conversation's
# model when that accepts images.
evaluation_models:
  # NVIDIA Ising-Calibration: Gemma 4 31B fine-tuned on qubit calibration plots
  # (fit quality, parameter extraction, success classification). Served by vLLM;
  # set VLLM_BASE_URL / VLLM_API_KEY. Move it to the top to make it the default.
  - provider: vllm
    name: nvidia/Ising-Calibration-1.5-31B-NVFP4
    # /v1/responses rejects input_image on vLLM; only chat/completions accepts
    # figures, which task analysis depends on.
    api_style: completion
    base_url: env:VLLM_BASE_URL
    api_key_env: VLLM_API_KEY
    # Must not exceed the server's max_model_len (16384 on llm.qiqb.dev).
    num_ctx: 16384
    # Model card recommendation. The model is not a thinking model.
    temperature: 0.2
    reasoning_effort: none
    disable_thinking_instruction: true
    # The prompt (system prompt + tool schemas) already takes roughly half of
    # the context, so leave the model card's 8192 for larger deployments.
    max_output_tokens: 2048

# Metrics to include in multi-metric evaluation
# Only these metrics will be used for overall chip health scoring
# Keys must match the metric keys defined in metrics.yaml
evaluation_metrics:
  qubit:
    - qubit_frequency
    - anharmonicity
    - t1
    - t1_average
    - t2_echo
    - t2_echo_average
    - t2_star
    - average_readout_fidelity
    - x90_gate_fidelity
  coupling:
    - zx90_gate_fidelity
    - bell_state_fidelity

# Scoring thresholds for AI evaluation
# Values should be in the displayed scale (after applying metric scale from metrics.yaml)
# higher_is_better: true means higher values are better (e.g., T1, fidelity)
scoring:
  t1:
    good: 50
    excellent: 100
    bad: 20
    unit: μs
    higher_is_better: true
  t1_average:
    good: 50
    excellent: 100
    bad: 20
    unit: μs
    higher_is_better: true
  t2_echo:
    good: 80
    excellent: 150
    bad: 30
    unit: μs
    higher_is_better: true
  t2_echo_average:
    good: 80
    excellent: 150
    bad: 30
    unit: μs
    higher_is_better: true
  t2_star:
    good: 20
    excellent: 40
    bad: 10
    unit: μs
    higher_is_better: true
  average_readout_fidelity:
    good: 95
    excellent: 99
    bad: 85
    unit: "%"
    higher_is_better: true
  x90_gate_fidelity:
    good: 99.5
    excellent: 99.9
    bad: 98.0
    unit: "%"
    higher_is_better: true
  x180_gate_fidelity:
    good: 99.5
    excellent: 99.9
    bad: 98.0
    unit: "%"
    higher_is_better: true
  bare_frequency:
    good: 4.5
    excellent: 5.0
    unit: GHz
    higher_is_better: true
  anharmonicity:
    good: -280
    excellent: -320
    bad: -250
    unit: MHz
    higher_is_better: false
  zx90_gate_fidelity:
    good: 95
    excellent: 99
    bad: 85
    unit: "%"
    higher_is_better: true
  bell_state_fidelity:
    good: 90
    excellent: 95
    bad: 80
    unit: "%"
    higher_is_better: true

# Task analysis configuration (side-panel chat in metrics modal)
analysis:
  enabled: true
  # Whether to send result figures to the LLM (requires multimodal model)
  multimodal: true
  # Reference images to send during task analysis.
  max_expected_images: 2
  # Maximum conversation turns to maintain in context
  max_conversation_turns: 10
