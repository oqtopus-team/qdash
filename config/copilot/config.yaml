# Copilot Shared Configuration
#
# The chat planner models live in chat.yaml, the calibration evaluation model
# in evaluation.yaml. Each file may have a `*.local.yaml` overlay.

enabled: true

# Language configuration
# thinking_language: Language for internal reasoning (en recommended for technical accuracy)
# response_language: User-facing language (auto follows the latest user message; ja/en pin it)
thinking_language: en
response_language: auto

# How a chat about one task result opens.
task_chat:
  # Send the result's figures to the planner (needs an image-capable model).
  multimodal: true
  # Reference images from the task's knowledge cases to send along, at most.
  max_expected_images: 2
