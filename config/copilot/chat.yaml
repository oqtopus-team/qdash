# Copilot Chat Configuration
#
# The planner models every chat can use, with or without a task result as its
# context. The first entry is the default; the UI offers the rest in a dropdown.
# The Pi Agent Runtime generates its models.json from this list at startup;
# `temperature`/`top_p`/`top_k` do not reach Bedrock there.
chat_models:
  # Default vendor-neutral OpenAI Chat Completions API. The base URL must include /v1.
  - provider: openai-compatible-chat
    name: qwen3.8-flash-next
    api_style: completion
    base_url: env:OPENAI_COMPATIBLE_BASE_URL_CHAT
    api_key_env: OPENAI_COMPATIBLE_API_KEY_CHAT
    temperature: 0.7
    top_p: 0.80
    top_k: 20
    sampling_params:
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
    sampling_params_by_thinking_level:
      minimal: &qwen_thinking_low
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: low
      low: *qwen_thinking_low
      medium:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: medium
      high:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: xhigh
    # Default thinking for every chat and planner-mode evaluation ("Auto" in the
    # chat's Thinking menu). Medium: high adds little on this model for a few
    # seconds more; pick High in the menu for hard questions.
    reasoning_effort: medium
    num_ctx: 65536
    # Chat answers and their thinking fit well within 8k; 16k reserved a quarter
    # of the 64k window for output and left prompts no room.
    max_output_tokens: 8192
    # Set `strict_tool_schemas: true` only on an endpoint (`base_url`) that
    # enforces OpenAI `strict` function schemas, so render_ui's arguments are
    # sampled against its schema. Without it the schema is sent unenforced.
    # Catalog models (OpenAI, Bedrock) need no setting.
  # - provider: openai-compatible-ollama
  #   name: nvidia/Gemma-4-31B-IT-NVFP4
  #   api_style: completion
  #   # Ollama endpoint. Set this to its OpenAI-compatible API base URL,
  #   # e.g. http://localhost:11434/v1. The OLLAMA suffix is operator-chosen.
  #   base_url: env:OPENAI_COMPATIBLE_BASE_URL_OLLAMA
  #   # Optional API key, forwarded when set.
  #   api_key_env: OPENAI_COMPATIBLE_API_KEY_OLLAMA
  #   keep_alive: 30m
  #   num_ctx: 16384
  #   temperature: 1.0
  #   top_p: 0.95
  #   top_k: 64
  #   reasoning_effort: none
  #   disable_thinking_instruction: true
  #   max_output_tokens: 4096
  # - provider: openai-compatible-ollama
  #   name: gemma4:31b
  #   api_style: completion
  #   base_url: env:OPENAI_COMPATIBLE_BASE_URL_OLLAMA
  #   api_key_env: OPENAI_COMPATIBLE_API_KEY_OLLAMA
  #   keep_alive: 30m
  #   num_ctx: 16384
  #   temperature: 1.0
  #   top_p: 0.95
  #   top_k: 64
  #   reasoning_effort: none
  #   disable_thinking_instruction: true
  #   max_output_tokens: 4096
  # - provider: openai
  #   name: gpt-5.4
  #   api_style: responses
  #   temperature: 0.7
  #   max_output_tokens: 4096
  # DeepSeek v4 flash via an OpenAI-compatible gateway (e.g. local ds4-server).
  # OPENAI_COMPATIBLE_BASE_URL_DS4 must include /v1.
  # DeepSeek only exposes /v1/chat/completions, so use api_style: completion.
  # Thinking mode is enabled by `reasoning_effort`; reasoning_content is
  # carried across tool rounds automatically. Uncomment when the suffixed
  # OpenAI-compatible variables below are configured.
  # - provider: openai-compatible-ds4
  #   name: deepseek-v4-flash
  #   api_style: completion
  #   base_url: env:OPENAI_COMPATIBLE_BASE_URL_DS4
  #   api_key_env: OPENAI_COMPATIBLE_API_KEY_DS4
  #   temperature: 0.7
  #   reasoning_effort: high
  #   max_output_tokens: 4096

  # - provider: bedrock
  #   name: jp.anthropic.claude-sonnet-4-6
  #   api_style: responses
  #   temperature: 0.7
  #   max_output_tokens: 4096

# Let a classifier model pick a fixed layout (calibration summary, execution
# comparison, failure list, or text) for values the chat already read, through
# the `present_results` tool. The classifier only picks the layout; the values
# shown are the ones the chat passed. The model comes from classifier.yaml: the
# first of its `classifier_models` unless `classifier` names another. When that
# model is unavailable (for example CLASSIFIER_BASE_URL or CLASSIFIER_API_KEY is
# unset) the tool is not offered and the chat renders with `render_ui` as
# before; set `enabled: false` to turn it off.
presentation:
  enabled: true
  # classifier:
  #   provider: system-one-classifier
  #   name: ZefanCai/Open-Jev-2B
  # Accept the chosen layout only when its probability is at least
  # min_probability and leads the runner-up by min_margin; otherwise the chat
  # falls back to render_ui or text.
  min_probability: 0.6
  min_margin: 0.2
  timeout_ms: 5000
