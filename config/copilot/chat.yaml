# Copilot Chat Configuration
#
# The planner models every chat can use, with or without a task result as its
# context. The first entry is the default; the UI offers the rest in a dropdown.
# The Pi Agent Runtime generates its models.json from this list at startup;
# `temperature`/`top_p`/`top_k` do not reach Bedrock there.
chat_models:
  # Default vendor-neutral OpenAI Chat Completions endpoint.
  - provider: openai-compatible
    name: qwen3.8-flash-next
    api_style: completion
    base_url: env:OPENAI_COMPATIBLE_BASE_URL
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    temperature: 0.7
    top_p: 0.80
    top_k: 20
    sampling_params:
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
    sampling_params_by_thinking_level:
      minimal: &qwen_thinking_low
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: low
      low: *qwen_thinking_low
      medium:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: medium
      high:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: xhigh
    reasoning_effort: high
    num_ctx: 65536
    # Chat answers and their thinking fit well within 8k; 16k reserved a quarter
    # of the 64k window for output and left prompts no room.
    max_output_tokens: 8192
