# Copilot Review Configuration
# Settings for task result analysis and chip scoring.

# Specialized models for task result analysis (chevron patterns, Rabi, etc.).
analysis_models:
  # Default vendor-neutral OpenAI Chat Completions endpoint.
  - provider: openai-compatible
    name: qwen3.8-flash-next
    api_style: completion
    base_url: env:OPENAI_COMPATIBLE_BASE_URL
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    temperature: 0.7
    top_p: 0.80
    top_k: 20
    sampling_params:
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
    sampling_params_by_thinking_level:
      minimal: &qwen_review_thinking_low
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: low
      low: *qwen_review_thinking_low
      medium:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: medium
      high:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        reasoning_effort: xhigh
    reasoning_effort: high
    num_ctx: 65536
    max_output_tokens: 8192
  # - provider: ollama
  #   name: nvidia/Gemma-4-31B-IT-NVFP4 # gemma4:26b
  #   api_style: completion
  #   # Ollama endpoint for LiteLLM. Set OLLAMA_BASE_URL to your Ollama server URL,
  #   # e.g. http://localhost:11434.
  #   base_url: env:OLLAMA_BASE_URL
  #   # Optional. LiteLLM forwards this when set.
  #   api_key_env: OLLAMA_API_KEY
  #   # Keep the local VLM resident between analysis requests and avoid
  #   # repeated cold model loads between short qdash analyses.
  #   keep_alive: 30m
  #   num_ctx: 16384
  #   # Gemma 4 best-practice sampling for stable local VLM analysis.
  #   temperature: 1.0
  #   top_p: 0.95
  #   top_k: 64
  #   reasoning_effort: none
  #   disable_thinking_instruction: true
  #   max_output_tokens: 4096
  # - provider: ollama
  #   name: gemma4:31b
  #   api_style: completion
  #   # Higher-stability local VLM fallback. It is slower than 26B but showed
  #   # fewer format failures in qdash analysis spot checks.
  #   base_url: env:OLLAMA_BASE_URL
  #   api_key_env: OLLAMA_API_KEY
  #   keep_alive: 30m
  #   num_ctx: 16384
  #   temperature: 1.0
  #   top_p: 0.95
  #   top_k: 64
  #   reasoning_effort: none
  #   disable_thinking_instruction: true
  #   max_output_tokens: 4096
  # - provider: openai
  #   name: gpt-5.4
  #   api_style: responses
  #   temperature: 0.7
  #   max_output_tokens: 4096
  # NVIDIA Ising-Calibration: Gemma 4 31B fine-tuned on qubit calibration plots
  # (fit quality, parameter extraction, success classification). Served by vLLM;
  # set VLLM_BASE_URL / VLLM_API_KEY. Move it to the top to make it the default.
  - provider: vllm
    name: nvidia/Ising-Calibration-1.5-31B-NVFP4
    # /v1/responses rejects input_image on vLLM; only chat/completions accepts
    # figures, which task analysis depends on.
    api_style: completion
    base_url: env:VLLM_BASE_URL
    api_key_env: VLLM_API_KEY
    # Must not exceed the server's max_model_len (16384 on llm.qiqb.dev).
    num_ctx: 16384
    # Model card recommendation. The model is not a thinking model.
    temperature: 0.2
    reasoning_effort: none
    disable_thinking_instruction: true
    # The prompt (system prompt + tool schemas) already takes roughly half of
    # the context, so leave the model card's 8192 for larger deployments.
    max_output_tokens: 2048

  # - provider: bedrock
  #   name: jp.anthropic.claude-sonnet-4-6
  #   api_style: responses
  #   temperature: 0.7
  #   max_output_tokens: 4096

# Metrics to include in multi-metric evaluation
# Only these metrics will be used for overall chip health scoring
# Keys must match the metric keys defined in metrics.yaml
evaluation_metrics:
  qubit:
    - qubit_frequency
    - anharmonicity
    - t1
    - t1_average
    - t2_echo
    - t2_echo_average
    - t2_star
    - average_readout_fidelity
    - x90_gate_fidelity
  coupling:
    - zx90_gate_fidelity
    - bell_state_fidelity

# Scoring thresholds for AI evaluation
# Values should be in the displayed scale (after applying metric scale from metrics.yaml)
# higher_is_better: true means higher values are better (e.g., T1, fidelity)
scoring:
  t1:
    good: 50
    excellent: 100
    bad: 20
    unit: μs
    higher_is_better: true
  t1_average:
    good: 50
    excellent: 100
    bad: 20
    unit: μs
    higher_is_better: true
  t2_echo:
    good: 80
    excellent: 150
    bad: 30
    unit: μs
    higher_is_better: true
  t2_echo_average:
    good: 80
    excellent: 150
    bad: 30
    unit: μs
    higher_is_better: true
  t2_star:
    good: 20
    excellent: 40
    bad: 10
    unit: μs
    higher_is_better: true
  average_readout_fidelity:
    good: 95
    excellent: 99
    bad: 85
    unit: "%"
    higher_is_better: true
  x90_gate_fidelity:
    good: 99.5
    excellent: 99.9
    bad: 98.0
    unit: "%"
    higher_is_better: true
  x180_gate_fidelity:
    good: 99.5
    excellent: 99.9
    bad: 98.0
    unit: "%"
    higher_is_better: true
  bare_frequency:
    good: 4.5
    excellent: 5.0
    unit: GHz
    higher_is_better: true
  anharmonicity:
    good: -280
    excellent: -320
    bad: -250
    unit: MHz
    higher_is_better: false
  zx90_gate_fidelity:
    good: 95
    excellent: 99
    bad: 85
    unit: "%"
    higher_is_better: true
  bell_state_fidelity:
    good: 90
    excellent: 95
    bad: 80
    unit: "%"
    higher_is_better: true

# Task analysis configuration (side-panel chat in metrics modal)
analysis:
  enabled: true
  # Whether to send result figures to the LLM (requires multimodal model)
  multimodal: true
  # Reference images to send during task analysis.
  max_expected_images: 2
  # Maximum conversation turns to maintain in context
  max_conversation_turns: 10
