# Minimal QUA configuration for one qubit with an IQ-mixer drive and readout on an OPX
# (controller con1). Frequencies are in Hz, lengths in ns, amplitudes in V.
version: 1
controllers:
  con1:
    analog_outputs:
      1: {offset: 0.0}
      2: {offset: 0.0}
      3: {offset: 0.0}
      4: {offset: 0.0}
    digital_outputs: {}
    analog_inputs:
      1: {offset: 0.0}
      2: {offset: 0.0}
elements:
  qubit:
    mixInputs:
      I: [con1, 1]
      Q: [con1, 2]
      lo_frequency: 5000000000
      mixer: mixer_qubit
    intermediate_frequency: 100000000
    operations:
      x180: x180_pulse
  resonator:
    mixInputs:
      I: [con1, 3]
      Q: [con1, 4]
      lo_frequency: 6000000000
      mixer: mixer_resonator
    intermediate_frequency: 50000000
    operations:
      readout: readout_pulse
    outputs:
      out1: [con1, 1]
      out2: [con1, 2]
    time_of_flight: 24
    smearing: 0
pulses:
  x180_pulse:
    operation: control
    length: 40
    waveforms: {I: x180_wf, Q: zero_wf}
  readout_pulse:
    operation: measurement
    length: 200
    waveforms: {I: readout_wf, Q: zero_wf}
    integration_weights:
      cos: cosine_weights
      sin: sine_weights
      minus_sin: minus_sine_weights
    digital_marker: "ON"
waveforms:
  x180_wf: {type: constant, sample: 0.2}
  readout_wf: {type: constant, sample: 0.1}
  zero_wf: {type: constant, sample: 0.0}
digital_waveforms:
  "ON":
    samples: [[1, 0]]
integration_weights:
  cosine_weights:
    cosine: [[1.0, 200]]
    sine: [[0.0, 200]]
  sine_weights:
    cosine: [[0.0, 200]]
    sine: [[1.0, 200]]
  minus_sine_weights:
    cosine: [[0.0, 200]]
    sine: [[-1.0, 200]]
mixers:
  mixer_qubit:
    - {intermediate_frequency: 100000000, lo_frequency: 5000000000, correction: [1, 0, 0, 1]}
  mixer_resonator:
    - {intermediate_frequency: 50000000, lo_frequency: 6000000000, correction: [1, 0, 0, 1]}
