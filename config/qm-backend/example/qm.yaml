# Sample QDash settings of the qm backend. Copy this directory to
# config/qm-backend/<chip_id>/ and replace the values with those of your QOP server.
# The QUA configuration itself is the native Quantum Machines configuration.py named by
# qm_config_file; QDash reads its 'config' dictionary unchanged.

# hardware: run programs on the OPX and publish fitted calibration values.
# simulator: send programs to the QOP simulator; records controller waveforms only and
#            never publishes calibration values.
mode: simulator

# Arguments for qm.QuantumMachinesManager. Both modes need a QOP server that the workflow
# worker can reach; the QOP simulator runs on that server.
connection:
  host: 127.0.0.1
  port: 80
  # cluster_name: Cluster_1
  # timeout: 60

# Simulator mode only: how much program time to simulate (multiple of 4 ns, at most
# 1000000). QMAmplitudeRabi needs one full sweep to fit; see simulator_run_parameters().
simulation:
  duration_ns: 40000

# Native QM configuration.py that defines 'config', relative to this file. QDash
# executes it as trusted Python in the workflow worker.
qm_config_file: ../../qm-config/example/configuration.py

# Names in that configuration for each QDash qubit ID, as qualang-tools
# QUA_calibrations expects them. The qubit operation is the pulse whose amplitude
# QMAmplitudeRabi scales.
qubits:
  "0":
    qubit_element: qubit
    qubit_operation: x180
    readout_element: resonator
    readout_operation: readout
    integration_weights: [cos, sin, minus_sin, cos]
    outputs: [out1, out2]
