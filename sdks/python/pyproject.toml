[project]
name = "qdash-sdk"
description = "Python SDK for the QDash API: generated resource clients and calibration helpers"
authors = [
    {name = "OQTOPUS Team", email = "oqtopus-team@googlegroups.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["version"]
# The runtime of the Fern-generated client in qdash/sdk/_generated and of the helpers.
# qdash-sdk does not depend on qdash-client; both can be installed side by side.
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "typing-extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.14",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Keep the version source identical to clients/python so both packages of one build
# carry the same version.
[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.version.raw-options.scm.git]
describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

# qdash-client ships qdash/client; neither wheel owns the qdash namespace.
[tool.hatch.build.targets.wheel]
only-include = ["src/qdash/sdk"]
sources = ["src"]

# The sdist carries the generation inputs next to the sources: the Fern configuration
# reads docs/oas/openapi.json from the repository, so it is not part of the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src/qdash/sdk", "fern", "README.md", "pyproject.toml"]
