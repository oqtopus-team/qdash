# Development override: load local pi extension checkouts into the Agent Runtime
# without publishing them or rebuilding the image.
#
# Clone each extension under agent-runtime/extensions/ (gitignored), then:
#
#   docker compose -f compose.yaml -f compose.extensions.yaml up -d agent-runtime
#
# A listed checkout is trusted by its path: every tool it defines is offered to
# the model without the pi-qdash allowlist review (experimental write names keep
# their opt-in; a tool is replayed after an interruption only when annotated
# read-only; a pinned tool name is replaced). Only mount code you are developing.
services:
  agent-runtime:
    volumes:
      - ./agent-runtime/extensions:/app/extensions:ro
    environment:
      # Colon-separated absolute package directories inside the container.
      - AGENT_RUNTIME_EXTENSION_PATHS=${AGENT_RUNTIME_EXTENSION_PATHS:-/app/extensions/pi-qcaleval}
