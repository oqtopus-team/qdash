<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="The agent uses Code Mode reads, proposal storage, and pure calibration builders to prepare proposals. Direct tools submit operations to QDash authorization and execution. Recorded evidence feeds the next agent decision; Code Mode cannot dispatch measurements or commits.">
<style>
.cd-reasoning { font-family: var(--vp-font-family-base, -apple-system, "Segoe UI", sans-serif); }
.cd-reasoning .box { fill: var(--vp-c-bg-soft, #f6f6f7); stroke: var(--vp-c-divider, #c2c2c4); stroke-width: 1.5; }
.cd-reasoning .accent { fill: var(--vp-c-brand-soft, #e8efff); stroke: var(--vp-c-brand-1, #3451b2); stroke-width: 1.5; }
.cd-reasoning text { fill: var(--vp-c-text-1, #202127); text-anchor: middle; font-size: 18px; }
.cd-reasoning .title { font-weight: 650; font-size: 21px; }
.cd-reasoning .note { fill: var(--vp-c-text-2, #5b5b66); font-size: 16px; }
.cd-reasoning .edge { fill: none; stroke: var(--vp-c-text-2, #5b5b66); stroke-width: 1.6; marker-end: url(#cd-reasoning-arrow); }
</style>
<defs><marker id="cd-reasoning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--vp-c-text-2, #5b5b66)"/></marker></defs>
<g class="cd-reasoning">
<rect x="40" y="25" width="380" height="112" rx="10" class="box"/>
<text x="230.0" y="56" class="title">Agent</text>
<text x="230.0" y="83" class="">Interpret the goal and evidence</text>
<text x="230.0" y="107" class="">Choose the next experiment</text>
<rect x="540" y="25" width="380" height="112" rx="10" class="box"/>
<text x="730.0" y="56" class="title">Code Mode</text>
<text x="730.0" y="83" class="">Read, build, validate, save proposal</text>
<text x="730.0" y="107" class="">Pure qdash.calibration builders</text>
<path d="M420 63 H540" class="edge"/>
<text x="480" y="52" class="note">prepare</text>
<path d="M540 112 H420" class="edge"/>
<text x="480" y="102" class="note">proposal</text>
<path d="M230 214 V235" class="edge"/>
<text x="230" y="177" class="title">Direct tools</text>
<text x="230" y="202" class="note">approval or bounded session grant</text>
<rect x="40" y="235" width="380" height="112" rx="10" class="accent"/>
<text x="230.0" y="266" class="title">QDash execution boundary</text>
<text x="230.0" y="293" class="">Check authority and current state</text>
<text x="230.0" y="317" class="">Dispatch tasks and gate updates</text>
<rect x="540" y="235" width="380" height="112" rx="10" class="accent"/>
<text x="730.0" y="266" class="title">Authoritative records</text>
<text x="730.0" y="293" class="">Measurements, candidates, commits</text>
<text x="730.0" y="317" class="">Assessments and operation IDs</text>
<path d="M420 290 H540" class="edge"/>
<text x="480" y="278" class="note">record</text>
<path d="M730 235 V185 H930 V10 H230 V25" class="edge"/>
<text x="740" y="172" class="note">Evidence for the next decision</text>
<text x="480" y="404" class="title">Code Mode can prepare and validate; it cannot measure or commit.</text>
<text x="480" y="436" class="note">Python and TypeScript SDKs share declarative spec semantics.</text>
</g>
</svg>
