<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-label="CheckT1 in execution 003 used qubit_frequency version 2 from execution 002 and hpi_amplitude version 4 from execution 003. Its output t1 version 7 was generated by CheckT1 and derived from both inputs, so lineage crosses executions.">
  <style>
    .qd-root { font-family: var(--vp-font-family-base, -apple-system, "Segoe UI", Roboto, sans-serif); }
    .qd-title { fill: var(--vp-c-text-1, #1f2328); font-size: 14px; font-weight: 600; text-anchor: middle; }
    .qd-sub { fill: var(--vp-c-text-2, #59636e); font-size: 11.5px; text-anchor: middle; }
    .qd-label { fill: var(--vp-c-text-2, #59636e); font-size: 11.5px; }
    .qd-edge { stroke: var(--vp-c-text-2, #59636e); stroke-width: 1.4; fill: none; }
    .qd-head { fill: var(--vp-c-text-2, #59636e); }
    .qd-dash { stroke-dasharray: 5 4; }
    .qd-lane { fill: rgba(128, 128, 128, 0.06); stroke: var(--vp-c-text-3, #8c959f); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .qd-lane-title { fill: var(--vp-c-text-1, #1f2328); font-size: 13px; font-weight: 600; }
    .qd-entity { fill: rgba(191, 135, 0, 0.14); stroke: #bf8700; stroke-width: 1.5; }
    .qd-activity { fill: rgba(9, 105, 218, 0.10); stroke: #0969da; stroke-width: 1.5; }
    .qd-derived { stroke: #db6d28; stroke-width: 1.6; fill: none; }
    .qd-derived-head { fill: #db6d28; }
    .qd-derived-label { fill: #db6d28; font-size: 11.5px; font-weight: 600; }
  </style>
  <defs>
    <marker id="qd-prov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="qd-head"/>
    </marker>
    <marker id="qd-prov-arrow-derived" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="qd-derived-head"/>
    </marker>
  </defs>

  <g class="qd-root">
    <!-- Execution lanes -->
    <rect x="20" y="20" width="310" height="370" rx="10" class="qd-lane"/>
    <text x="36" y="44" class="qd-lane-title">Execution 002</text>
    <rect x="350" y="20" width="670" height="370" rx="10" class="qd-lane"/>
    <text x="366" y="44" class="qd-lane-title">Execution 003</text>

    <!-- Activities -->
    <rect x="95" y="106" width="160" height="48" rx="6" class="qd-activity"/>
    <text x="175" y="135" class="qd-title">CheckRamsey</text>

    <rect x="440" y="106" width="160" height="48" rx="6" class="qd-activity"/>
    <text x="520" y="135" class="qd-title">CreateHPIPulse</text>

    <rect x="770" y="106" width="160" height="48" rx="6" class="qd-activity"/>
    <text x="850" y="135" class="qd-title">CheckT1</text>

    <!-- Entities -->
    <ellipse cx="175" cy="300" rx="105" ry="32" class="qd-entity"/>
    <text x="175" y="297" class="qd-title">qubit_frequency:Q0</text>
    <text x="175" y="314" class="qd-sub">v2 · 8.121 GHz</text>

    <ellipse cx="520" cy="300" rx="105" ry="32" class="qd-entity"/>
    <text x="520" y="297" class="qd-title">hpi_amplitude:Q0</text>
    <text x="520" y="314" class="qd-sub">v4 · 0.031</text>

    <ellipse cx="850" cy="300" rx="105" ry="32" class="qd-entity"/>
    <text x="850" y="297" class="qd-title">t1:Q0</text>
    <text x="850" y="314" class="qd-sub">v7 · 48.2 µs</text>

    <!-- wasGeneratedBy: entity -> activity -->
    <line x1="175" y1="268" x2="175" y2="156" class="qd-edge" marker-end="url(#qd-prov-arrow)"/>
    <text x="183" y="216" class="qd-label">wasGeneratedBy</text>
    <line x1="520" y1="268" x2="520" y2="156" class="qd-edge" marker-end="url(#qd-prov-arrow)"/>
    <text x="528" y="216" class="qd-label">wasGeneratedBy</text>
    <line x1="850" y1="268" x2="850" y2="156" class="qd-edge" marker-end="url(#qd-prov-arrow)"/>
    <text x="858" y="216" class="qd-label">wasGeneratedBy</text>

    <!-- used: activity -> current input version -->
    <polyline points="850,106 850,72 305,72 305,300 283,300" class="qd-edge qd-dash" marker-end="url(#qd-prov-arrow)"/>
    <text x="578" y="64" class="qd-label" text-anchor="middle">used (current version, from execution 002)</text>
    <line x1="800" y1="154" x2="576" y2="271" class="qd-edge qd-dash" marker-end="url(#qd-prov-arrow)"/>
    <text x="690" y="200" class="qd-label" text-anchor="middle">used</text>

    <!-- wasDerivedFrom: output entity -> each input entity -->
    <line x1="745" y1="300" x2="627" y2="300" class="qd-derived" marker-end="url(#qd-prov-arrow-derived)"/>
    <text x="686" y="292" class="qd-derived-label" text-anchor="middle">wasDerivedFrom</text>
    <polyline points="850,332 850,360 175,360 175,334" class="qd-derived" marker-end="url(#qd-prov-arrow-derived)"/>
    <text x="512" y="378" class="qd-derived-label" text-anchor="middle">wasDerivedFrom</text>

    <!-- Legend -->
    <g transform="translate(20,412)">
      <ellipse cx="14" cy="7" rx="14" ry="8" class="qd-entity"/>
      <text x="36" y="11" class="qd-label">Entity (ParameterVersion)</text>
      <rect x="210" y="0" width="28" height="14" rx="3" class="qd-activity"/>
      <text x="246" y="11" class="qd-label">Activity (task run)</text>
      <text x="400" y="11" class="qd-label">Arrows point from source_id to target_id, as stored in provenance_relations.</text>
    </g>
  </g>
</svg>
