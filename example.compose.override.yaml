# =============================================================================
# Docker Compose Override Example
# =============================================================================
# Copy this file to compose.override.yaml and customize as needed.
# compose.override.yaml is automatically loaded by Docker Compose.
# It is gitignored, so your customizations won't be committed.
#
# Common use cases:
# - Custom volume mount paths (e.g., NAS, external drives)
# - Custom network configuration
# - Additional services
#
# The default stack publishes only Caddy at UI_PORT. For local CLI development,
# use `task dev-local`; for HTTPS use
# `docker compose -f compose.yaml -f compose.https.yaml up -d` with CLIENT_URL
# set to an HTTPS domain. The HTTPS override requires Docker Compose 2.24.4+.
# For direct loopback database access, use
# `docker compose -f compose.yaml -f compose.admin.yaml --profile admin up -d`.
# =============================================================================

# -----------------------------------------------------------------------------
# Example: Custom volume paths
# -----------------------------------------------------------------------------
# Uncomment and modify the services you need to customize.
#
# services:
#   workflow:
#     volumes:
#       - /nas/shared/calib_data:/app/calib_data
#       - /nas/shared/qubex_config:/app/config/qubex-config
#
#   api:
#     volumes:
#       - /nas/shared/calib_data:/app/calib_data
#       - /nas/shared/qpu_data:/app/qpu_data
#       - /nas/shared/qubex_config:/app/config/qubex-config
#
#   user-flow-worker:
#     volumes:
#       - /nas/shared/calib_data:/app/calib_data
#       - /nas/shared/qubex_config:/app/config/qubex-config

# -----------------------------------------------------------------------------
# Example: Custom network with static IPs
# -----------------------------------------------------------------------------
# Useful when you need predictable IP addresses for firewall rules.
#
# networks:
#   custom_net:
#     driver: bridge
#     ipam:
#       config:
#         - subnet: 172.20.0.0/16
#           gateway: 172.20.0.1
