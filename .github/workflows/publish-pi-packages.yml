name: Publish pi packages

on:
  pull_request:
    branches: [develop]
    paths:
      - "packages/**"
      - "agent-runtime/**"
      - "package.json"
      - "bun.lock"
      - ".github/scripts/pi-package-*"
      - ".github/workflows/publish-pi-packages.yml"
  push:
    branches: [develop]
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/scripts/pi-package-*"
      - ".github/workflows/publish-pi-packages.yml"
    tags:
      - "pi-qdash/v*"
      - "pi-qcaleval/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [pi-qdash, pi-qcaleval]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check and test package
        working-directory: packages/${{ matrix.package }}
        run: |
          bun run check
          bun run test

      - name: Check runtime integration and release versioning
        run: |
          bun run --cwd agent-runtime check
          bun run --cwd agent-runtime test
          node --test .github/scripts/pi-package-release.test.mjs

      - name: Set package version
        env:
          PI_PACKAGE: ${{ matrix.package }}
        run: node .github/scripts/pi-package-release.mjs "$PI_PACKAGE"

      - name: Pack
        working-directory: packages/${{ matrix.package }}
        run: npm pack --ignore-scripts

      - name: Verify standalone tarball
        env:
          PI_PACKAGE: ${{ matrix.package }}
        # This tests a fresh consumer install; the artifact itself was built from bun.lock.
        # jactionlint ignore=adhoc-packages
        run: |
          consumer="$(mktemp -d)"
          archive="$(realpath packages/"$PI_PACKAGE"/*.tgz)"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund \
            "$archive" @earendil-works/pi-coding-agent@1.4.0 @earendil-works/pi-ai@1.4.0 typebox@1.3.27
          bun .github/scripts/pi-package-smoke.mjs "$consumer" "$PI_PACKAGE"

      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.package }}-dist
          path: packages/${{ matrix.package }}/*.tgz
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/pi-qdash/v') ||
      startsWith(github.ref, 'refs/tags/pi-qcaleval/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        package: [pi-qdash, pi-qcaleval]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ matrix.package }}-dist
          path: dist

      - name: Publish package
        if: >-
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, format('refs/tags/{0}/v', matrix.package))
        run: |
          tag=latest
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then tag=beta; fi
          npm publish ./dist/*.tgz --access public --provenance --tag "$tag"
