name: Publish @oqtopus-team/qdash-client

# Only publish-typescript-packages.yml calls this workflow, for PR, develop, and release
# tag builds, so packages share one client version. npm Trusted Publishing validates the
# calling workflow's filename, so a direct trigger here could not publish. After a QDash
# beta or stable npm publication, the publish job uploads a qdash-client-release record;
# publish-qdash-client.yml builds the PyPI client from that record when this run completes.
on:
  workflow_call:
    inputs:
      publish:
        description: Publish the built client before dependent pi packages
        type: boolean
        default: false
    outputs:
      version:
        description: Exact version of the client tarball from this run
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  group: qdash-typescript-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
      python: ${{ steps.version.outputs.python }}
      channel: ${{ steps.version.outputs.channel }}
    name: Build TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Tags and first-parent history derive the shared QDash client version.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated client
        working-directory: clients/typescript
        run: |
          bun run generate
          git diff --exit-code -- src/generated

      - name: Run checks
        working-directory: clients/typescript
        run: bun run check

      - name: Test release versioning
        run: node --test .github/scripts/client-release.test.mjs

      - name: Set package version
        id: version
        run: node .github/scripts/client-release.mjs

      - name: Build package
        working-directory: clients/typescript
        run: |
          bun run build
          npm pack --pack-destination dist --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qdash-typescript-client-dist
          overwrite: true
          path: clients/typescript/dist/oqtopus-team-qdash-client-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: qdash-typescript-client-dist
          path: dist

      - name: Publish package
        # Authenticates with npm Trusted Publishing (OIDC) as the calling workflow.
        run: |
          case "$CLIENT_CHANNEL" in
            latest|beta) ;;
            *) echo "This build is validation-only" >&2; exit 1 ;;
          esac
          # A beta version belongs to a commit, so a rerun finds it already published.
          if [ "$(npm view "@oqtopus-team/qdash-client@$CLIENT_VERSION" version 2>/dev/null)" = "$CLIENT_VERSION" ]; then
            echo "@oqtopus-team/qdash-client@$CLIENT_VERSION is already published"
            exit 0
          fi
          npm publish ./dist/oqtopus-team-qdash-client-*.tgz --access public --provenance --tag "$CLIENT_CHANNEL"
        env:
          CLIENT_CHANNEL: ${{ needs.build.outputs.channel }}
          CLIENT_VERSION: ${{ needs.build.outputs.version }}

      # Hand this run's exact QDash version to the PyPI workflow.
      - name: Write PyPI release record
        run: |
          mkdir release
          jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg run_id "$GITHUB_RUN_ID" \
            --arg channel "$CLIENT_CHANNEL" --arg version "$CLIENT_VERSION" --arg python "$PYTHON_VERSION" \
            '{sha: $sha, ref: $ref, run_id: $run_id, channel: $channel, version: $version, python: $python}' \
            > release/release.json
          cat release/release.json
        env:
          CLIENT_CHANNEL: ${{ needs.build.outputs.channel }}
          CLIENT_VERSION: ${{ needs.build.outputs.version }}
          PYTHON_VERSION: ${{ needs.build.outputs.python }}

      - name: Upload PyPI release record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qdash-client-release
          # A full rerun recomputes the version; the newest record replaces the old one.
          overwrite: true
          path: release/release.json
          if-no-files-found: error
