name: Publish TypeScript packages

# This is the common QDash release pipeline. Its client job computes one QDash version
# per run and publishes the npm client; both pi packages derive their versions from it,
# so a QDash vX.Y.Z tag releases all of them as X.Y.Z. The client job also uploads a
# qdash-client-release record, and publish-qdash-client.yml publishes the PyPI client
# from it when this run completes. The paths therefore include the Python client.
on:
  pull_request:
    branches: [develop]
    paths:
      - "clients/python/**"
      - "sdks/python/**"
      - "clients/typescript/**"
      - "packages/**"
      - "docs/oas/openapi.json"
      - "ui/src/schemas/**"
      - "Taskfile.yaml"
      - "agent-runtime/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "bun.lock"
      - ".github/scripts/client-release*"
      - ".github/scripts/pi-package-*"
      - ".github/workflows/publish-qdash-client.yml"
      - ".github/workflows/publish-qdash-typescript-client.yml"
      - ".github/workflows/publish-typescript-packages.yml"
  push:
    branches: [develop]
    paths:
      - "clients/python/**"
      - "sdks/python/**"
      - "clients/typescript/**"
      - "packages/**"
      - "docs/oas/openapi.json"
      - "ui/src/schemas/**"
      - "Taskfile.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "bun.lock"
      - ".github/scripts/client-release*"
      - ".github/scripts/pi-package-*"
      - ".github/workflows/publish-qdash-client.yml"
      - ".github/workflows/publish-qdash-typescript-client.yml"
      - ".github/workflows/publish-typescript-packages.yml"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: TypeScript client
    uses: ./.github/workflows/publish-qdash-typescript-client.yml
    permissions:
      contents: read
      id-token: write
    with:
      # The called workflow also publishes the stable client for QDash vX.Y.Z tags.
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

  build:
    needs: client
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [pi-qdash, pi-qcaleval]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build local TypeScript client
        run: bun run build:client

      - name: Check and test package
        working-directory: packages/${{ matrix.package }}
        run: |
          bun run check
          bun run test

      - name: Check runtime integration and release versioning
        run: |
          bun run --cwd agent-runtime check
          bun run --cwd agent-runtime test
          node --test .github/scripts/pi-package-release.test.mjs

      - name: Set package version
        env:
          PI_PACKAGE: ${{ matrix.package }}
          QDASH_CLIENT_VERSION: ${{ needs.client.outputs.version }}
        run: node .github/scripts/pi-package-release.mjs "$PI_PACKAGE"

      - name: Pack
        working-directory: packages/${{ matrix.package }}
        run: npm pack --ignore-scripts

      - name: Download matching client tarball
        if: matrix.package == 'pi-qdash'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: qdash-typescript-client-dist
          path: client-dist

      - name: Verify standalone tarball
        env:
          PI_PACKAGE: ${{ matrix.package }}
        shell: bash
        # This tests a fresh consumer install; the artifact itself was built from bun.lock.
        # jactionlint ignore=adhoc-packages
        run: |
          consumer="$(mktemp -d)"
          archive="$(realpath packages/"$PI_PACKAGE"/*.tgz)"
          client=()
          if [ "$PI_PACKAGE" = "pi-qdash" ]; then
            client=("$(realpath client-dist/*.tgz)")
          fi
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund \
            "$archive" "${client[@]}" @earendil-works/pi-coding-agent@1.4.0 @earendil-works/pi-ai@1.4.0 typebox@1.3.27
          bun .github/scripts/pi-package-smoke.mjs "$consumer" "$PI_PACKAGE"

      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.package }}-dist
          path: packages/${{ matrix.package }}/*.tgz
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [client, build]
    # QDash vX.Y.Z tags are the only stable path; every package releases as X.Y.Z.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        package: [pi-qdash, pi-qcaleval]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ matrix.package }}-dist
          path: dist

      - name: Publish package
        env:
          PI_PACKAGE: ${{ matrix.package }}
        run: |
          # npm reads a bare "dist/x.tgz" as GitHub shorthand, so pass an absolute path.
          archive="$(realpath dist/*.tgz)"
          # A rerun of a QDash tag finds X.Y.Z already published and skips it.
          tag="$(node .github/scripts/pi-package-release.mjs --publish-tag "$PI_PACKAGE" "$archive")"
          if [ -z "$tag" ]; then
            echo "Skipping $PI_PACKAGE: no new version to publish for $GITHUB_REF"
            exit 0
          fi
          npm publish "$archive" --access public --provenance --tag "$tag"
