name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  labeler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch --all

      - name: Extract commit messages
        run: |
          COMMITS=$(git log --format=%B origin/develop..HEAD)
          echo "$COMMITS"
          echo "$COMMITS" > commits.txt

      - name: Debug - Print commits
        run: cat commits.txt

      - name: Set labels based on commit messages
        id: set-labels
        run: |
          labels=()
          while IFS= read -r commit; do
            echo "Processing commit: $commit"
            if [[ $commit =~ ^feat ]]; then
              labels+=("feature")
            elif [[ $commit =~ ^fix ]]; then
              labels+=("bugfix")
            elif [[ $commit =~ ^docs ]]; then
              labels+=("documentation")
            elif [[ $commit =~ ^style ]]; then
              labels+=("style")
            elif [[ $commit =~ ^refactor ]]; then
              labels+=("refactor")
            elif [[ $commit =~ ^test ]]; then
              labels+=("test")
            elif [[ $commit =~ ^ci ]]; then
              labels+=("ci")
            elif [[ $commit =~ ^chore ]]; then
              labels+=("chore")
            fi
          done < commits.txt

          # Remove duplicate labels and join them as a newline-separated string
          unique_labels=$(printf "%s\n" "${labels[@]}" | sort -u)

          # Debug output for unique labels
          echo "Unique labels:"
          echo "$unique_labels"

          # Set the output as a newline-separated string
          {
            echo "labels<<EOF"
            echo "$unique_labels"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add labels to PR
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: ${{ steps.set-labels.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          while IFS= read -r label; do
            if [[ -n "${label}" ]]; then
              gh pr edit "${PR_NUMBER}" --add-label "${label}"
            fi
          done <<< "${LABELS}"

      - name: Assign PR creator
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.actor]
            })
