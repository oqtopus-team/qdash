name: PR Labeler

on:
  # Commit subjects are handled only as data; this workflow does not check out or run
  # pull request code.
  # jactionlint ignore=dangerous-triggers
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  labeler:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Extract commit messages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '.[].commit.message | split("\n")[0]' > commits.txt

      - name: Set labels based on commit messages
        id: set-labels
        run: |
          labels=()
          while IFS= read -r commit; do
            if [[ $commit =~ ^feat ]]; then
              labels+=("feature")
            elif [[ $commit =~ ^fix ]]; then
              labels+=("bugfix")
            elif [[ $commit =~ ^docs ]]; then
              labels+=("documentation")
            elif [[ $commit =~ ^style ]]; then
              labels+=("style")
            elif [[ $commit =~ ^refactor ]]; then
              labels+=("refactor")
            elif [[ $commit =~ ^test ]]; then
              labels+=("test")
            elif [[ $commit =~ ^ci ]]; then
              labels+=("ci")
            elif [[ $commit =~ ^chore ]]; then
              labels+=("chore")
            fi
          done < commits.txt

          # Remove duplicate labels and join them as a newline-separated string
          unique_labels=$(printf "%s\n" "${labels[@]}" | sort -u)

          # Debug output for unique labels
          echo "Unique labels:"
          echo "$unique_labels"

          # Set the output as a newline-separated string
          {
            echo "labels<<EOF"
            echo "$unique_labels"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add labels to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABELS: ${{ steps.set-labels.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          while IFS= read -r label; do
            if [[ -n "${label}" ]]; then
              gh pr edit "${PR_NUMBER}" --add-label "${label}"
            fi
          done <<< "${LABELS}"

      - name: Assign PR creator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login]
            })
