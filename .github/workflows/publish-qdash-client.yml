name: Publish qdash-client

# Publishes the Python packages qdash-client and qdash-sdk. PyPI Trusted Publishing for
# both must be registered for this filename, and PyPI does not support reusable workflows, so
# this stays a top-level workflow. It never computes a publishable version itself:
# publish-typescript-packages.yml computes one QDash version per run, publishes the npm
# client, and uploads a qdash-client-release record. When that run completes,
# workflow_run builds both packages from the same commit with the record's PEP 440
# version, publishes qdash-client, and then qdash-sdk. qdash-sdk is self-contained (it does
# not depend on qdash-client); both carry the same version. Pull requests and manual runs
# only validate.
on:
  pull_request:
    branches: [develop]
    paths:
      - "clients/python/**"
      - "sdks/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/client-release*"
      - ".github/workflows/publish-qdash-client.yml"
  # The build job verifies the triggering run with default-branch code before it checks
  # out or runs the triggering commit, and has no id-token; the publish job runs no
  # repository code. PyPI does not support reusable-workflow publishers.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: [Publish TypeScript packages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A cheap pre-filter only; the "Verify release source" step is the security check.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    outputs:
      channel: ${{ steps.release.outputs.channel }}
    name: Build qdash-client and qdash-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      # For workflow_run, github.sha is the default branch, so these release scripts are
      # trusted; the triggering commit is checked out only after they accept it.
      - name: Checkout release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: trusted
          sparse-checkout: .github

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Test release versioning
        working-directory: trusted
        run: node --test .github/scripts/client-release.test.mjs

      # The npm client publishes before the record exists, so a missing record means
      # the TypeScript run published no QDash client and this run fails visibly.
      - name: Download release record
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: qdash-client-release
          path: ${{ runner.temp }}/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Accept only a vX.Y.Z tag on main or a develop push of this repository whose
      # record names the same commit, ref, run, and version; see pypiRelease.
      - name: Verify release source
        id: release
        if: github.event_name == 'workflow_run'
        working-directory: trusted
        run: node .github/scripts/client-release.mjs --pypi "$RUNNER_TEMP/release/release.json"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          path: source
          # Build the verified commit the TypeScript pipeline released.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Set validation version
        id: check
        if: github.event_name != 'workflow_run'
        working-directory: source
        run: node .github/scripts/client-release.mjs --python

      # Both packages get the record's version. qdash-sdk must not depend on qdash-client.
      - name: Build packages
        shell: bash
        working-directory: source
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.release.outputs.version || steps.check.outputs.version }}
          CLIENT_VERSION: ${{ steps.release.outputs.version || steps.check.outputs.version }}
        run: |
          test -n "$CLIENT_VERSION"
          uv build --package qdash-client --out-dir dist
          uv build --package qdash-sdk --out-dir dist
          test -f "dist/qdash_client-$CLIENT_VERSION-py3-none-any.whl"
          test -f "dist/qdash_sdk-$CLIENT_VERSION-py3-none-any.whl"
          unzip -p "dist/qdash_sdk-$CLIENT_VERSION-py3-none-any.whl" "qdash_sdk-$CLIENT_VERSION.dist-info/METADATA" \
            > sdk-metadata.txt
          if grep -i "^Requires-Dist: qdash-client" sdk-metadata.txt; then
            echo "qdash-sdk must not depend on qdash-client" >&2
            exit 1
          fi

      - name: Run tests
        working-directory: source
        # The SDK's distribution tests install each package alone in fresh environments and
        # prove the SDK imports nothing from qdash-client.
        run: |
          uv run --package qdash-client pytest clients/python/tests -v
          uv run --package qdash-sdk pytest sdks/python/tests -v

      - name: Run lint and type checks
        working-directory: source
        run: |
          uv run --package qdash-client ruff check clients/python sdks/python
          uv run --package qdash-client ruff format --check clients/python sdks/python
          uv run --package qdash-client mypy clients/python/src/qdash/client clients/python/tests
          uv run --package qdash-sdk mypy sdks/python/src/qdash/sdk sdks/python/src/qdash/calibration sdks/python/tests

      # One artifact per package, so each publish job uploads only its own files.
      - name: Upload qdash-client artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qdash-client-dist
          path: source/dist/qdash_client-*
          if-no-files-found: error

      - name: Upload qdash-sdk artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qdash-sdk-dist
          path: source/dist/qdash_sdk-*
          if-no-files-found: error

  publish:
    name: Publish qdash-client to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: >-
      github.event_name == 'workflow_run' &&
      (needs.build.outputs.channel == 'latest' || needs.build.outputs.channel == 'beta')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: qdash-client-dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          # Rerunning this run reuses the same record, so it finds the version published.
          skip-existing: true

  # qdash-sdk publishes after qdash-client so one release record lands as a pair. If this
  # job fails after the client published, rerun the failed jobs: they reuse
  # this run's artifacts and record, and skip-existing skips a version already on PyPI.
  publish-sdk:
    name: Publish qdash-sdk to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build, publish]
    if: >-
      github.event_name == 'workflow_run' &&
      (needs.build.outputs.channel == 'latest' || needs.build.outputs.channel == 'beta')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: qdash-sdk-dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
